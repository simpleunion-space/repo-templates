services:
  build:
    image: ${UNITY_EDITOR_IMAGE:?Set UNITY_EDITOR_IMAGE to a GameCI Unity editor image.}
    working_dir: /workspace
    command: ["sh", "tools/scripts/build.sh"]
    environment:
      UNITY_LICENSE: ${UNITY_LICENSE:-}
      UNITY_BUILD_TARGET: ${UNITY_BUILD_TARGET:?Set UNITY_BUILD_TARGET to a Unity build target.}
    volumes:
      - ../..:/workspace:ro
      - ../../build/{{PROJECT_NAME}}:/workspace/build/{{PROJECT_NAME}}
      - unity-library:/workspace/src/{{PROJECT_NAME}}/Library
      - unity-temp:/workspace/src/{{PROJECT_NAME}}/Temp
      - unity-logs:/workspace/src/{{PROJECT_NAME}}/Logs
      - unity-user-settings:/workspace/src/{{PROJECT_NAME}}/UserSettings

volumes:
  unity-library:
  unity-temp:
  unity-logs:
  unity-user-settings:
